name: Create SDR-VST3 SQ4KOU TEST release

on:
  push:
    branches:
      - feature/sq4kou-hardware
    paths:
      - .github/workflows/release-build202.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.head_commit.message == 'Create SDR-VST3_SQ4KOU_TEST release from build 232'
    runs-on: ubuntu-latest
    steps:
      - name: Download exact build 232 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SQ4KOU/SDR-VST3_SQ4KOU/actions/artifacts/11280504532/zip" \
            -o "SDR-VST3_SQ4KOU_TEST_build232.zip"

      - name: Create GitHub release from build 232
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "SDR-VST3_SQ4KOU_TEST" \
            --repo "SQ4KOU/SDR-VST3_SQ4KOU" \
            --target "d5cf53f8b0c0db3905a94cd14bfb223aae7631b5" \
            --title "SDR-VST3_WDSP_2.10_test" \
            --notes "Test release based exactly on SDR-VST3 SQ4KOU Hardware build #232. Includes welded panel positions and Shift+LMB resize/persistence for the Bandscope/Waterfall panel." \
            "SDR-VST3_WDSP_2.10_test_build202.zip"
