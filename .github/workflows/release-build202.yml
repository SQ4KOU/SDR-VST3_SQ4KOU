name: Release SDR-VST3-GPU SQ4KOU build 238

on:
  push:
    branches:
      - feature/sq4kou-hardware
    paths:
      - .github/workflows/release-build202.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.head_commit.message == 'Release SDR-VST3-GPU_SQ4KOU from build 238'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: SQ4KOU/SDR-VST3_SQ4KOU
    steps:
      - name: Verify and download exact build 238
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/37183622902 > run.json
          jq -e '.run_number == 238 and .conclusion == "success" and .head_sha == "b447ccdc82fd7921a6cb6972ca4cc52b1ac5ca33"' run.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/11296515513/zip" \
            -o build238.zip
          echo "4960424993ebbec328e56c95286a92aa897e29272191701b6a9d22d723cecff4  build238.zip" | sha256sum --check
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("build238.zip") as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir() and entry.filename.lower().endswith(".msi")]
              if len(files) != 1:
                  raise RuntimeError(f"Expected one MSI, found {len(files)}")
              data = archive.read(files[0])
          if not data.startswith(bytes.fromhex("D0CF11E0A1B11AE1")):
              raise RuntimeError("Invalid MSI compound-file header")
          Path("SDR-VST3-GPU_SQ4KOU.msi").write_bytes(data)
          print(f"Original MSI: {files[0].filename}")
          print(f"MSI SHA256: {hashlib.sha256(data).hexdigest()}")
          PY

      - name: Publish MSI release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Wydanie z dokładnego buildu #238.
          
          Commit: b447ccdc82fd7921a6cb6972ca4cc52b1ac5ca33
          Zawiera poprawkę zachowania napisu SQ4KOU pod paskiem postępu.
          Załączony MSI pochodzi z artefaktu buildu #238; zmieniono wyłącznie nazwę pliku.
          EOF
          gh release create "SDR-VST3-GPU_SQ4KOU" \
            --target "b447ccdc82fd7921a6cb6972ca4cc52b1ac5ca33" \
            --title "SDR-VST3-GPU_SQ4KOU" \
            --notes-file release-notes.md \
            "SDR-VST3-GPU_SQ4KOU.msi"
